# Put this server block next to your existing TLS setup.
server {
    listen 443 ssl;
    http2 on;
    server_name cloud.example.com;
    # ssl_certificate ...; ssl_certificate_key ...;

    # uploads/downloads are streamed straight through, nothing is spooled in RAM or on the router's flash
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

# Admin UI: a SEPARATE server block that listens only on the router's LAN address.
# nclite itself serves the admin only on admin_listen (127.0.0.1:8090 here); the public
# port above answers 404 for it, so it cannot be reached through the public domain.
# Open it at http://192.168.1.1:83/admin (matches admin_url in config.json);
# the file browser is at http://192.168.1.1:83/cloud/ (web_path).
server {
    listen 192.168.1.1:83;
    server_name _;
    client_max_body_size 0;
    proxy_buffering off;          # videos and big photos in the file browser stream straight through
    proxy_http_version 1.1;

    # one block serves both: /admin (administration) and /cloud (file browser)
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
